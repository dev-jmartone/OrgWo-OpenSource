<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador Manual de Templates QR — OrgWo</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    /* Fluent Microsoft theme colors */
    --primary: #0078D4;
    --primary-hover: #106EBE;
    --primary-soft: #DEECF9;
    --bg-color: #FAF9F8;
    --bg-deep: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F3F2F1;
    --text: #201F1E;
    --text-muted: #605E5C;
    --text-faint: #8A8886;
    --border: #E1DFDD;
    --border-soft: #EDEBE9;
    --shadow: 0 1.6px 3.6px rgba(0,0,0,0.08), 0 0.3px 0.9px rgba(0,0,0,0.06);
    --shadow-hover: 0 6.4px 14.4px rgba(0,0,0,0.13), 0 1.2px 3.6px rgba(0,0,0,0.10);
    --radius: 6px;
    --danger: #A4262C;
    --success: #107C10;
    --accent: #5C2D91;
}

:root[data-theme="dark"] {
    --primary-soft: #1F3A5F;
    --bg-color: #1B1A19;
    --bg-deep: #201F1E;
    --surface: #252423;
    --surface-2: #2D2C2B;
    --text: #F3F2F1;
    --text-muted: #C8C6C4;
    --text-faint: #8A8886;
    --border: #3B3A39;
    --border-soft: #323130;
    --shadow: 0 4px 12px rgba(0,0,0,0.3);
    --shadow-hover: 0 8px 24px rgba(0,0,0,0.4);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', 'Segoe UI Variable', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: var(--bg-color);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
}

header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-mark {
    background: var(--primary);
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.1rem;
}

.brand-title {
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
}

.brand-tag {
    font-size: 0.75rem;
    background: var(--primary-soft);
    color: var(--primary);
    padding: 2px 6px;
    border-radius: 99px;
    font-weight: 600;
}

.actions-top {
    display: flex;
    align-items: center;
    gap: 12px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid transparent;
    padding: 8px 16px;
    font-size: 0.875rem;
    font-weight: 600;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    font-family: inherit;
}

.btn-primary {
    background: var(--primary);
    color: #fff;
}
.btn-primary:hover {
    background: var(--primary-hover);
}

.btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border-color: var(--border);
}
.btn-secondary:hover {
    background: var(--border-soft);
}

.btn-ghost {
    background: transparent;
    color: var(--text-muted);
}
.btn-ghost:hover {
    background: var(--surface-2);
    color: var(--text);
}

.main-container {
    display: flex;
    flex: 1;
    min-height: 0;
    width: 100%;
}

.editor-pane {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    max-height: 100vh;
}

.preview-pane {
    width: 650px;
    padding: 24px;
    background: var(--bg-deep);
    overflow-y: auto;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
}

.floating-theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all 0.2s ease;
}
.floating-theme-toggle:hover {
    transform: scale(1.1);
    color: var(--text);
    background: var(--surface-2);
}

.section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
}

.section-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 10px;
}

.section-card-header h3 {
    font-size: 1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}

.field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
}

.field-full {
    grid-column: 1 / -1;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.03em;
}

.field input, .field select, .field textarea {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.875rem;
    width: 100%;
    outline: none;
    transition: border-color 0.2s ease;
}

.field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--primary);
}

.field input.is-invalid, .field select.is-invalid, .field textarea.is-invalid {
    border-color: var(--danger);
    background-color: rgba(164, 38, 44, 0.03);
}

.field-error {
    font-size: 0.75rem;
    color: var(--danger);
    margin-top: 2px;
}

/* Items list visual style */
.item-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
}

.item-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.item-card-title {
    font-weight: 700;
    font-size: 0.875rem;
    color: var(--primary);
}

.item-remove {
    background: transparent;
    border: none;
    color: var(--danger);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.item-remove:hover {
    background: rgba(164, 38, 44, 0.1);
}

.preview-container {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #FFFFFF; /* standard email bg is white */
    padding: 24px;
    flex: 1;
    box-shadow: var(--shadow);
    color: #000000;
    overflow-x: auto;
}

.preview-title {
    font-weight: 700;
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
}

.subject-bar {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    font-size: 0.9rem;
    margin-bottom: 16px;
    font-weight: bold;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.preview-scroll-wrapper {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    flex: 1;
    overflow-y: auto;
    color: #000000;
}

.preview-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
}

.warning-banner {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: rgba(193, 156, 0, 0.08);
    border: 1px solid rgba(193, 156, 0, 0.3);
    color: var(--text);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 16px;
    font-size: 0.8rem;
}

/* Responsive grid changes */
@media (max-width: 1200px) {
    .main-container {
        flex-direction: column;
    }
    .editor-pane {
        max-height: none;
    }
    .preview-pane {
        width: 100%;
        max-height: none;
        border-top: 1px solid var(--border);
    }
}
</style>
</head>
<body>

<button class="floating-theme-toggle" id="themeToggle" title="Cambiar tema">
    <i data-lucide="sun"></i>
</button>

<a href="GeneradorVisa.html" class="floating-theme-toggle" id="visaToggle" title="Generador VISA Masivo" style="right: 70px; text-decoration: none; color: var(--text-muted);">
    <i data-lucide="file-spreadsheet"></i>
</a>

<main class="main-container">
    <!-- Left panel: form editor -->
    <section class="editor-pane">
        <form id="planillaForm" onsubmit="return false;">
            <!-- General Settings -->
            <div class="section-card">
                <div class="section-card-header">
                    <h3><i data-lucide="settings"></i> Datos del Template</h3>
                </div>
                <div class="field-grid">
                    <div class="field">
                        <label for="planAction">Acción</label>
                        <select id="planAction"></select>
                    </div>
                    <div class="field">
                        <label for="planReason">Razón</label>
                        <select id="planReason"></select>
                    </div>
                    <div class="field">
                        <label for="planLogistics">Logística</label>
                        <select id="planLogistics">
                            <option value="presencial">Presencial</option>
                            <option value="correo_interno">Correo interno</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="planTicket">Número de Ticket (WO / INC / REQ)</label>
                        <input type="text" id="planTicket" placeholder="INC00000XXXXXXXX o WO00000XXXXXXX">
                        <small class="field-error" id="error-planTicket"></small>
                    </div>
                </div>
            </div>

            <!-- Entities involved -->
            <div class="section-card">
                <div class="section-card-header">
                    <h3><i data-lucide="users"></i> Personas e Involucrados</h3>
                </div>
                <div class="field-grid">
                    <div class="field">
                        <label for="planEmpresa">Empresa Propietaria</label>
                        <input type="text" id="planEmpresa" placeholder="Empresa Principal, Subsidiaria, Proveedor" list="dlEmpresas">
                        <button type="button" id="btnAgregarConsultora" style="display: none; padding: 4px 8px; font-size: 11px; margin-top: 4px; border: 1px dashed var(--primary, #0078d4); color: var(--primary, #0078d4); background: transparent; border-radius: 4px; cursor: pointer; width: fit-content; font-family: inherit;">+ Agregar Consultora</button>
                    </div>
                    <div class="field">
                        <label for="planTecnico">Técnico que entrega (Firma)</label>
                        <input type="text" id="planTecnico" placeholder="Nombre del Técnico">
                    </div>
                    <div class="field">
                        <label for="planPersonaRetira">Persona que retira / recibe</label>
                        <input type="text" id="planPersonaRetira" placeholder="Nombre completo del usuario">
                        <small class="field-error" id="error-planPersonaRetira"></small>
                    </div>
                    <div class="field">
                        <label for="planEmailRetira">Email del usuario</label>
                        <input type="email" id="planEmailRetira" placeholder="usuario@empresa.com">
                    </div>
                </div>
                <div class="warning-banner" id="externalUserWarning" style="display: none;">
                    <i data-lucide="alert-triangle" style="flex-shrink: 0; color: var(--warn);"></i>
                    <div>El email ingresado corresponde a un usuario externo. Verificá y confirmá manualmente la empresa propietaria del equipo.</div>
                </div>
            </div>

            <!-- Greeting section -->
            <div class="section-card">
                <div class="section-card-header">
                    <h3><i data-lucide="mail"></i> Saludo del Email</h3>
                    <button type="button" class="btn btn-secondary btn-xs" id="btnToggleSaludoEditor" style="padding: 4px 8px; font-size: 0.75rem;">
                        Personalizar Saludo
                    </button>
                </div>
                <div class="field" id="saludoSelectorWrap">
                    <label for="planSaludoSelect">Elegir Saludo</label>
                    <select id="planSaludoSelect">
                        <option value="">Predeterminado automático</option>
                    </select>
                </div>
                <div class="field" id="saludoEditorWrap" style="display: none; margin-top: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label for="planSaludo">Texto del Saludo</label>
                        <div style="display: flex; gap: 6px;">
                            <button type="button" class="btn btn-ghost" id="btnLoadDefaultSaludo" style="padding: 2px 6px; font-size: 11px;">Default</button>
                            <button type="button" class="btn btn-ghost" id="btnResetSaludo" style="padding: 2px 6px; font-size: 11px; color: var(--danger);">Limpiar</button>
                        </div>
                    </div>
                    <textarea id="planSaludo" rows="4" placeholder="Podés usar tokens: {saludo}, {fecha}, {elemento}, {persona}"></textarea>
                </div>
            </div>

            <!-- Items dynamic section -->
            <div class="section-card">
                <div class="section-card-header">
                    <h3><i data-lucide="package"></i> Ítems del Movimiento</h3>
                    <button type="button" class="btn btn-primary" id="btnAddItem" style="padding: 6px 12px; font-size: 0.8rem;">
                        <i data-lucide="plus" style="width: 14px; height: 14px;"></i> Agregar ítem
                    </button>
                </div>
                <div id="itemsContainer">
                    <!-- Dynamic items will be added here -->
                </div>
                <small class="field-error" id="error-itemsList" style="display: none; font-size: 0.8rem; margin-top: 10px;"></small>
            </div>
        </form>
    </section>

    <!-- Right panel: live template preview -->
    <section class="preview-pane">
        <div class="preview-title">
            <i data-lucide="eye"></i> Vista Previa del Template
        </div>
        <div class="subject-bar">
            <div>
                <span style="font-weight: normal; color: var(--text-muted); font-size: 0.8rem; margin-right: 4px;">Asunto:</span>
                <span id="previewSubject">—</span>
            </div>
            <button class="btn btn-ghost" id="btnCopySubject" title="Copiar Asunto" style="padding: 4px 8px;">
                <i data-lucide="copy" style="width: 14px; height: 14px;"></i>
            </button>
        </div>

        <div class="preview-scroll-wrapper" id="previewHtmlBody">
            <!-- Rendered template body -->
        </div>

        <div class="preview-actions">
            <button class="btn btn-primary" id="btnSendOutlook" style="flex: 1;">
                <i data-lucide="mail"></i> Enviar por Outlook (App)
            </button>
            <button class="btn btn-secondary" id="btnClearAll" style="flex: 1;">
                <i data-lucide="trash-2"></i> Limpiar Formulario
            </button>
        </div>
    </section>
</main>

<datalist id="dlEmpresas">
    <option value="Proveedor TI">
    <option value="Empresa Principal">
    <option value="Subsidiaria">
    <option value="Servicios Operativos">
</datalist>
<datalist id="dlMarcas">
    <option value="Lenovo">
    <option value="Dell">
    <option value="HP">
    <option value="Samsung">
    <option value="Motorola">
    <option value="Apple">
    <option value="Logitech">
    <option value="Jabra">
</datalist>

<script>
// ============================================================
// CONSTANTS & REGISTRIES
// ============================================================
const ITEM_TYPES = {
    PC:        { label: 'Notebook / PC',     fields: ['marca','modelo','serie'],                   labelTipo: 'máquina',            labelTicket: 'a la configuración de la PC', labelRetira: 'el equipo' },
    CEL:       { label: 'Celular',           fields: ['marca','modelo','serie','imei1','imei2'],   labelTipo: 'celular',            labelTicket: '',                            labelRetira: 'el celular' },
    MONITOR:   { label: 'Monitor',           fields: ['marca','modelo','serie'],                   labelTipo: 'monitor',            labelTicket: '',                            labelRetira: 'el monitor' },
    KIT:       { label: 'Kit Inalámbrico',   fields: ['marca','modelo','serie'],                   labelTipo: 'kit inalámbrico',    labelTicket: 'del kit',                     labelRetira: 'el kit',     defaultMarca: 'Logitech', defaultModelo: 'MK235' },
    VINCHA:    { label: 'Vincha',            fields: ['marca','modelo','serie'],                   labelTipo: 'vincha',             labelTicket: 'de la vincha',                labelRetira: 'la vincha',  defaultMarca: 'Jabra',    defaultModelo: 'Evolve 20' },
    CARGADOR:  { label: 'Cargador',          fields: ['marca','modelo','serie'],                   labelTipo: 'cargador',           labelTicket: '',                            labelRetira: 'el cargador' },
    ADAPTADOR: { label: 'Adaptador',         fields: ['marca','modelo'],                           labelTipo: 'adaptador',          labelTicket: '',                            labelRetira: 'el adaptador' },
    HDMI:      { label: 'Cable HDMI',        fields: ['marca'],                                    labelTipo: 'cable HDMI',         labelTicket: '',                            labelRetira: 'el cable' },
    PARLANTE:  { label: 'Parlante',          fields: ['marca','modelo','serie'],                   labelTipo: 'parlante',           labelTicket: '',                            labelRetira: 'el parlante' },
};

const MOV_TYPES = {
    egreso:        { label: 'Egreso',                  short: 'Egreso',     templateLabel: 'Egreso',                       equipmentRole: 'new' },
    ingreso:       { label: 'Ingreso',                 short: 'Ingreso',    templateLabel: 'Ingreso',                      equipmentRole: 'old' },
    egreso_wipe:   { label: 'Egreso (wipe presencial)', short: 'Egreso w.', templateLabel: 'Wipe Presencial - Egreso',     equipmentRole: 'old' },
    ingreso_wipe:  { label: 'Ingreso (wipe presencial)',short: 'Ingreso w.',templateLabel: 'Ingreso Wipe Presencial',      equipmentRole: 'old' },
};

const PERIPHERAL_TYPES = ['KIT','VINCHA','CARGADOR','ADAPTADOR','HDMI','PARLANTE'];
const EQUIPMENT_TYPES  = ['PC','CEL','MONITOR'];
const ALL_ITEM_TYPES   = [...EQUIPMENT_TYPES, ...PERIPHERAL_TYPES];

const RECAMBIO_VALID_TYPES = ['PC','CEL','MONITOR','VINCHA','CARGADOR','ADAPTADOR','HDMI','PARLANTE'];
const PRESTAMO_VALID_TYPES = ['PC','CEL','MONITOR','VINCHA','CARGADOR','ADAPTADOR','HDMI','PARLANTE'];

const ACTION_RULES = {
    asignacion: {
        label: 'Asignación',
        reasons: {
            normal: { label: 'Asignación', movs: ['egreso'], allowMulti: true, motivoLabel: 'Nuevo Ingreso', validItemTypes: ALL_ITEM_TYPES },
            empleado_nuevo: { label: 'Empleado nuevo (alta)', movs: ['egreso'], allowMulti: true, motivoLabel: 'Nuevo Ingreso', validItemTypes: ['PC','CEL','MONITOR','KIT','VINCHA','CARGADOR'] },
        },
    },
    recambio: {
        label: 'Recambio',
        reasons: {
            beneficio:    { label: 'Beneficio (3 años)',  movs: ['egreso_wipe','egreso'],               motivoLabel: 'Recambio Tecnologico', validItemTypes: ['PC','CEL'] },
            tecnologico:  { label: 'Recambio tecnológico',movs: ['egreso_wipe','egreso'],               motivoLabel: 'Recambio Tecnologico', validItemTypes: ['PC','CEL'] },
            defectuoso:   { label: 'Defectuoso',          movs: ['egreso','ingreso'], peripheralMovs: ['egreso'], motivoLabel: 'Cambio por defectuoso', validItemTypes: RECAMBIO_VALID_TYPES },
            garantia:     { label: 'Gestión de garantía', movs: ['egreso','ingreso'],                   motivoLabel: 'Gestión de garantía',  validItemTypes: ['PC','CEL','MONITOR'] },
            robo_perdida: { label: 'Robo / pérdida',      movs: ['egreso'],                             motivoLabel: 'Robo / pérdida — viejo no ingresa', validItemTypes: ['PC','CEL'] },
            sector:       { label: 'Sector completo',     movs: ['egreso','ingreso'], allowMulti: true, motivoLabel: 'Reemplazo de sector',  validItemTypes: ['PC','CEL','MONITOR'] },
        },
    },
    prestamo: {
        label: 'Préstamo',
        reasons: {
            normal: { label: 'Préstamo (devuelve mismo día 17hs)', movs: ['egreso'], devuelveHoy: '17:00', motivoLabel: 'Préstamo', validItemTypes: PRESTAMO_VALID_TYPES },
        },
    },
    renuncia: {
        label: 'Renuncia',
        reasons: {
            normal: { label: 'Ingreso a depósito por renuncia', movs: ['ingreso_wipe'], allowMulti: true, motivoLabel: 'Renuncia', validItemTypes: ['PC','CEL','MONITOR'] },
            beneficio: { label: 'Renuncia con Beneficio (compra de equipo)', movs: ['egreso_wipe'], allowMulti: true, motivoLabel: 'Renuncia con Beneficio', validItemTypes: ['PC','CEL'] },
        },
    },
    reemplazo: {
        label: 'Reemplazo',
        reasons: {
            sector: { label: 'Reemplazo en sector', movs: ['egreso','ingreso'], allowMulti: true, motivoLabel: 'Reemplazo', validItemTypes: ['PC','CEL','MONITOR'] },
        },
    },
};

const LOGISTICS = {
    presencial:     { label: 'Presencial',     subjectSuffix: '' },
    correo_interno: { label: 'Correo interno', subjectSuffix: ' + Correo Interno' },
};

const EMAIL_DOMAIN_TO_COMPANY = {
    'subsidiaria.com': 'Subsidiaria',
    'texpert.com.ar': 'Texpert',
    'empresa.com': 'Empresa Principal',
    'newpay.com.ar':  'Newpay',
};

const EXTERNAL_EMAIL_PATTERNS = [
    /^serv\.externos\./i,

const DEFAULT_OBS_VALUES = new Set(Object.values(DEFAULT_OBS));
const CORREO_INTERNO_SUFFIX = 'Se realiza el envío por correo interno ya que el usuario no puede acercarse a DT.';

function defaultObsFor(type, mov, action, reason, logistics) {
    if (!type || !mov || !action || !reason) {
        return logistics === 'correo_interno' ? CORREO_INTERNO_SUFFIX : '';
    }
    const base = DEFAULT_OBS[`${type}/${mov}/${action}/${reason}`] || '';
    if (logistics === 'correo_interno') {
        return base ? `${base}\n${CORREO_INTERNO_SUFFIX}` : CORREO_INTERNO_SUFFIX;
    }
    return base;
}

function isDefaultObs(text) {
    if (!text) return true;
    if (DEFAULT_OBS_VALUES.has(text)) return true;
    if (text === CORREO_INTERNO_SUFFIX) return true;
    const tail = '\n' + CORREO_INTERNO_SUFFIX;
    if (text.endsWith(tail)) {
        const base = text.slice(0, -tail.length);
        if (DEFAULT_OBS_VALUES.has(base)) return true;
    }
    return false;
}

// QR CODE CLIENT SIDE ENGINE
function generateQrCodeDataUri(text) {
    if (!text) return '';
    try {
        const qr = qrcode(0, 'M');
        qr.addData(text);
        qr.make();
        // cell size: 4, margin: 4
        return qr.createDataURL(4, 4);
    } catch (e) {
        console.error('Error generating QR code', e);
        return '';
    }
}

function buildQrText(item, spec) {
    const typeDef = ITEM_TYPES[item.type] || ITEM_TYPES.PC;
    const tipoLabel = (typeDef.label || '').split(' / ')[0];
    const movLabel = (item.mov === 'ingreso' || item.mov === 'ingreso_wipe') ? 'Ingreso' : 'Egreso';
    const marcaModelo = `${item.marca || ''} ${item.modelo || ''}`.trim();
    const serie = item.serie || 'S/N';
    const ticket = item.ticket || spec.ticket || 'SIN-TICKET';
    
    return `Ticket: ${ticket}
Elemento: ${tipoLabel}
Movimiento: ${movLabel}
Marca/Modelo: ${marcaModelo}
Serie: ${serie}`;
}

function escapeHtml(text) {
    if (!text) return '';
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function formatDateAR(iso) {
    if (!iso) return '';
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
    return m ? `${m[3]}/${m[2]}/${m[1]}` : iso;
}

function getTodayString() {
    return new Date().toISOString().split('T')[0];
}

function inferEmpresaFromEmail(email) {
    if (!email) return { empresa: '', isExternal: false };
    const at = email.lastIndexOf('@');
    if (at < 0) return { empresa: '', isExternal: false };
    const domain = email.slice(at + 1).toLowerCase().trim();
    if (!domain) return { empresa: '', isExternal: false };
    if (domain.startsWith('serv.externos.empresa')) {
        return { empresa: 'Externos Empresa Principal', isExternal: true };
    }
    if (domain.startsWith('serv.externos.subsidiaria')) {
        return { empresa: 'Externos Subsidiaria', isExternal: true };
    }
    if (EXTERNAL_EMAIL_PATTERNS.some(re => re.test(domain))) {
        return { empresa: '', isExternal: true };
    }
    return { empresa: EMAIL_DOMAIN_TO_COMPANY[domain] || '', isExternal: false };
}

function documentTitleFor(item, actionId, reasonId) {
    const role = MOV_TYPES[item.mov]?.equipmentRole || 'new';
    const baseMov = String(item.mov || '').replace(/_wipe$/, '');

    if (actionId === 'recambio' && (reasonId === 'beneficio' || reasonId === 'tecnologico')) {
        return role === 'old' ? 'EGRESA POR BENEFICIO' : 'EGRESA POR ASIGNACIÓN';
    }
    if (actionId === 'recambio' && reasonId === 'defectuoso') {
        return role === 'old' ? 'INGRESA EQUIPO EN FALLA' : 'EGRESA EQUIPO PRÉSTAMO';
    }
    if (actionId === 'recambio' && reasonId === 'garantia') {
        return role === 'old' ? 'INGRESA PARA GARANTÍA' : 'EGRESA EQUIPO PRÉSTAMO';
    }
    if (actionId === 'recambio' && reasonId === 'robo_perdida') return 'EGRESA POR ASIGNACIÓN';
    if (actionId === 'recambio' && reasonId === 'sector') {
        return baseMov === 'ingreso' ? 'INGRESA EQUIPO DE BAJA' : 'EGRESA POR REEMPLAZO';
    }
    if (actionId === 'reemplazo') {
        return role === 'old' ? 'INGRESA EQUIPO POR REEMPLAZO' : 'EGRESA POR REEMPLAZO';
    }
    if (actionId === 'asignacion') return 'EGRESA POR ASIGNACIÓN';
    if (actionId === 'prestamo') return 'EGRESA EQUIPO PRÉSTAMO';
    if (actionId === 'renuncia') return 'INGRESA EQUIPO POR RENUNCIA';
    return baseMov === 'ingreso' ? 'INGRESA' : 'EGRESA';
}

function saludoTokenValues(spec) {
    const hour = new Date().getHours();
    let greeting = 'Buen día';
    if (hour >= 9 && hour < 12) greeting = 'Buenos días';
    else if (hour >= 12 && hour < 18) greeting = 'Buenas tardes';
    const firstItem = spec.items[0];
    const firstTypeDef = firstItem ? (ITEM_TYPES[firstItem.type] || ITEM_TYPES.PC) : {};
    const elementoTxt = (firstTypeDef.label || 'equipo').split(' / ')[0].toLowerCase();
    const prefix = (elementoTxt.includes('vincha')) ? 'de la ' : 'del ';
    return {
        saludo:    greeting,
        fecha:     formatDateAR(firstItem?.fechaMovimiento) || formatDateAR(getTodayString()),
        elemento:  `${prefix}${elementoTxt}`,
        persona:   spec.personaRetira || '',
    };
}

function renderSaludoTokens(text, spec) {
    const vals = saludoTokenValues(spec);
    return String(text || '').replace(/\{(saludo|fecha|elemento|persona)\}/g, (_, k) => vals[k] ?? '');
}

function buildSaludoPlainAuto(spec) {
    const defaults = {
        asignacion: '{saludo}\n\nSaludos Rafael\n\nSe notifica que el día {fecha} se realizará la entrega {elemento} al usuario {persona}.\n\nDetalle {elemento}',
        recambio: '{saludo}\n\nSaludos Rafael\n\nSe realiza el recambio del día {fecha} {elemento} de {persona}.',
        prestamo: '{saludo}\n\nSaludos Rafael\n\nSe realiza el préstamo del día {fecha} {elemento} de {persona}.',
        renuncia: '{saludo}\n\nSaludos Rafael\n\nSe recibe el {elemento} por renuncia de {persona} el día {fecha}.',
        reemplazo: '{saludo}\n\nSaludos Rafael\n\nSe realiza el reemplazo de {elemento} de {persona} el día {fecha}.'
    };
    return defaults[spec.action] || defaults.asignacion;
}

function buildPlanillaSubject(spec) {
    const labelOf = it => (ITEM_TYPES[it.type]?.label || it.type).split(' ')[0];
    const uniq = [...new Set(spec.items.map(labelOf))];
    const itemsSummary = uniq.join(' + ') || '—';
    
    const classification = itemsSummary;
    const ticket = spec.ticket || 'SIN-TICKET';
    const persona = spec.personaRetira || 'Usuario';
    const suffix = LOGISTICS[spec.logistics]?.subjectSuffix || '';
    
    return `${ticket} | ${classification} | ${persona}${suffix}`.trim();
}

function initializeFormElements() {
    // Populate Actions
    const actionSelect = document.getElementById('planAction');
    actionSelect.innerHTML = Object.entries(ACTION_RULES)
        .map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
    actionSelect.value = planillaSpec.action;

    // Populate Reasons

    document.getElementById('planTicket').value = planillaSpec.ticket;
    document.getElementById('planEmpresa').value = planillaSpec.empresa;
    document.getElementById('planTecnico').value = planillaSpec.tecnico || localStorage.getItem('tecnico_manual_pref') || '';
    document.getElementById('planPersonaRetira').value = planillaSpec.personaRetira;
    document.getElementById('planEmailRetira').value = planillaSpec.emailRetira;
    document.getElementById('planSaludo').value = planillaSpec.saludoOverride;

    const { isExternal } = inferEmpresaFromEmail(planillaSpec.emailRetira || '');
    const btnAgregar = document.getElementById('btnAgregarConsultora');
    if (btnAgregar) {
        btnAgregar.style.display = isExternal ? 'inline-block' : 'none';
    }

    if (planillaSpec.saludoOverride) {
        document.getElementById('saludoEditorWrap').style.display = 'flex';
        document.getElementById('btnToggleSaludoEditor').textContent = 'Ocultar Editor';
    }

    renderItemsList();
    updatePreview();
    lucide.createIcons();
}

function populateReasonDropdown() {
    const action = document.getElementById('planAction').value;
    const reasonSelect = document.getElementById('planReason');

    reasonSelect.innerHTML = Object.entries(reasons)
        .map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
    reasonSelect.value = planillaSpec.reason;
}

    errorList.style.display = 'none';

    if (planillaSpec.items.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-faint); padding: 20px 0; font-size: 0.9rem;">No hay ítems agregados. Hacé clic en "Agregar ítem" para comenzar.</div>`;
        return;
    }

    planillaSpec.items.forEach((item, index) => {
        const typeDef = ITEM_TYPES[item.type] || ITEM_TYPES.PC;
        const hasImeis = item.type === 'CEL';

        const card = document.createElement('div');
        card.className = 'item-card';
        card.dataset.index = index;

        // Types and movs selects
        const typeOptions = Object.entries(ITEM_TYPES)
            .map(([k, v]) => `<option value="${k}" ${item.type === k ? 'selected' : ''}>${v.label}</option>`).join('');
        
        // Allowed movs based on rule
        const rule = ACTION_RULES[planillaSpec.action]?.reasons[planillaSpec.reason];
        const allowedMovs = rule?.movs || ['egreso'];
        const movOptions = Object.entries(MOV_TYPES)
            .filter(([k]) => allowedMovs.includes(k) || k === 'ingreso' || k === 'egreso') // Allow fallbacks
            .map(([k, v]) => `<option value="${k}" ${item.mov === k ? 'selected' : ''}>${v.label}</option>`).join('');

        card.innerHTML = `
            <div class="item-card-header">
                <span class="item-card-title">Ítem #${index + 1}: ${typeDef.label}</span>
                <button type="button" class="item-remove" onclick="removeItem(${index})" title="Quitar ítem">
                    <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
                </button>
            </div>
            <div class="field-grid" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));">
                <div class="field">
                    <label>Tipo Elemento</label>
                    <select class="item-field" data-prop="type" onchange="updateItemType(${index}, this.value)">
                        ${typeOptions}
                    </select>
                </div>
                <div class="field">
                    <label>Movimiento</label>
                    <select class="item-field" data-prop="mov" onchange="updateItemMov(${index}, this.value)">
                        ${movOptions}
                    </select>
                </div>
                <div class="field">
                    <label>Número de Ticket</label>
                    <input type="text" class="item-field" data-prop="ticket" value="${escapeHtml(item.ticket || '')}" placeholder="Ticket / Incidente" oninput="updateItemField(${index}, 'ticket', this.value)">
                </div>
                <div class="field">
                    <label>Marca</label>
                    <input type="text" class="item-field" data-prop="marca" value="${escapeHtml(item.marca)}" list="dlMarcas" oninput="updateItemField(${index}, 'marca', this.value)">
                </div>
                <div class="field">
                    <label>Modelo</label>
                    <input type="text" class="item-field" data-prop="modelo" value="${escapeHtml(item.modelo)}" oninput="updateItemField(${index}, 'modelo', this.value)">
                </div>
                <div class="field">
                    <label>Número de Serie</label>
                    <input type="text" class="item-field" data-prop="serie" value="${escapeHtml(item.serie)}" placeholder="S/N" oninput="updateItemField(${index}, 'serie', this.value)">
                </div>
                
                ${hasImeis ? `
                <div class="field">
                    <label>IMEI 1</label>
                    <input type="text" class="item-field" data-prop="imei1" value="${escapeHtml(item.imei1)}" placeholder="IMEI 1" oninput="updateItemField(${index}, 'imei1', this.value)">
                </div>
                <div class="field">
                    <label>IMEI 2</label>
                    <input type="text" class="item-field" data-prop="imei2" value="${escapeHtml(item.imei2)}" placeholder="IMEI 2" oninput="updateItemField(${index}, 'imei2', this.value)">
                </div>
                ` : ''}

                <div class="field">
                    <label>Fecha Movimiento</label>
                    <input type="date" class="item-field" data-prop="fechaMovimiento" value="${item.fechaMovimiento}" onchange="updateItemField(${index}, 'fechaMovimiento', this.value)">
                </div>

                <div class="field">
                    <label>Fecha Asignación</label>
                    <input type="date" class="item-field" data-prop="fechaAsignacion" value="${item.fechaAsignacion}" onchange="updateItemField(${index}, 'fechaAsignacion', this.value)">
                </div>

                <div class="field field-full">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label>Observaciones</label>
                        <button type="button" class="btn btn-ghost" style="padding: 2px 4px; font-size: 10px; height:auto; min-height:0;" onclick="resetItemObs(${index})">Recargar Obs por Defecto</button>
                    </div>
                    <textarea class="item-field" data-prop="obs" rows="2" oninput="updateItemField(${index}, 'obs', this.value)">${escapeHtml(item.obs)}</textarea>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
    lucide.createIcons();
}

// ============================================================
// INTERACTIVE FUNCTIONS
// ============================================================
window.removeItem = function(index) {
    planillaSpec.items.splice(index, 1);
    renderItemsList();
    updatePreview();
    autosaveState();
};

window.updateItemType = function(index, type) {
    const item = planillaSpec.items[index];
    item.type = type;
    
    // Fill default values if any
    const typeDef = ITEM_TYPES[type] || ITEM_TYPES.PC;
    item.marca = typeDef.defaultMarca || '';
    item.modelo = typeDef.defaultModelo || '';
    
    // Recalculate observations if default
    if (isDefaultObs(item.obs)) {
        item.obs = defaultObsFor(item.type, item.mov, planillaSpec.action, planillaSpec.reason, planillaSpec.logistics);
    }
    
    renderItemsList();
    updatePreview();
    autosaveState();
};

window.updateItemMov = function(index, mov) {
    const item = planillaSpec.items[index];
    item.mov = mov;
    
    // Recalculate observations if default
    if (isDefaultObs(item.obs)) {
        item.obs = defaultObsFor(item.type, item.mov, planillaSpec.action, planillaSpec.reason, planillaSpec.logistics);
    }
    
    renderItemsList();
    updatePreview();
    autosaveState();
};

window.updateItemField = function(index, field, value) {
    planillaSpec.items[index][field] = value;
    updatePreview();
    autosaveState();
};

window.resetItemObs = function(index) {
    const item = planillaSpec.items[index];
    item.obs = defaultObsFor(item.type, item.mov, planillaSpec.action, planillaSpec.reason, planillaSpec.logistics);
    renderItemsList();
    updatePreview();
    autosaveState();
};

// Global Event Listeners
document.getElementById('planAction').addEventListener('change', (e) => {
    planillaSpec.action = e.target.value;
    populateReasonDropdown();
    planillaSpec.reason = document.getElementById('planReason').value;
    
    // Regenerate default items if list is empty, or reload observations
    if (planillaSpec.items.length > 0) {
        planillaSpec.items.forEach(it => {
            if (isDefaultObs(it.obs)) {
                it.obs = defaultObsFor(it.type, it.mov, planillaSpec.action, planillaSpec.reason, planillaSpec.logistics);
            }
        });
    }
    
    renderItemsList();
    updatePreview();
    autosaveState();
});

document.getElementById('planReason').addEventListener('change', (e) => {
    planillaSpec.reason = e.target.value;
    
    if (planillaSpec.items.length > 0) {
        planillaSpec.items.forEach(it => {
            if (isDefaultObs(it.obs)) {
                it.obs = defaultObsFor(it.type, it.mov, planillaSpec.action, planillaSpec.reason, planillaSpec.logistics);
            }
        });
    }
    
    renderItemsList();
    updatePreview();
    autosaveState();
});

document.getElementById('planLogistics').addEventListener('change', (e) => {
    planillaSpec.logistics = e.target.value;
    
    // Update observations suffix when logistics changes
    if (planillaSpec.items.length > 0) {
        planillaSpec.items.forEach(it => {
            if (isDefaultObs(it.obs)) {
                it.obs = defaultObsFor(it.type, it.mov, planillaSpec.action, planillaSpec.reason, planillaSpec.logistics);
            }
        });
    }
    
    renderItemsList();
    updatePreview();
    autosaveState();
});

document.getElementById('planTicket').addEventListener('input', (e) => {
    document.getElementById('error-planTicket').textContent = '';
    document.getElementById('planTicket').classList.remove('is-invalid');
    const oldTicket = planillaSpec.ticket;
    const newTicket = e.target.value;
    planillaSpec.ticket = newTicket;
    
    if (planillaSpec.items) {
        planillaSpec.items.forEach((item, index) => {
            if (item.ticket === oldTicket || !item.ticket) {
                item.ticket = newTicket;
                const itemInputs = document.querySelectorAll(`.item-card[data-index="${index}"] input[data-prop="ticket"]`);
                itemInputs.forEach(input => {
                    input.value = newTicket;
                });
            }
        });
    }
    
    updatePreview();
    autosaveState();
});

document.getElementById('planEmpresa').addEventListener('input', (e) => {
    planillaSpec.empresa = e.target.value;
    updatePreview();
    autosaveState();
});

document.getElementById('planTecnico').addEventListener('input', (e) => {
    planillaSpec.tecnico = e.target.value;
    localStorage.setItem('tecnico_manual_pref', e.target.value);
    updatePreview();
    autosaveState();
});

document.getElementById('planPersonaRetira').addEventListener('input', (e) => {
    planillaSpec.personaRetira = e.target.value;
    document.getElementById('error-planPersonaRetira').textContent = '';
    document.getElementById('planPersonaRetira').classList.remove('is-invalid');
    updatePreview();
    autosaveState();
});

document.getElementById('planEmailRetira').addEventListener('input', (e) => {
    const val = e.target.value;
    planillaSpec.emailRetira = val;
    
    // Try to auto-derive company from email domain
    const derived = inferEmpresaFromEmail(val);
    if (derived.empresa) {
        planillaSpec.empresa = derived.empresa;
        document.getElementById('planEmpresa').value = derived.empresa;
    }
    
    const warningEl = document.getElementById('externalUserWarning');
    if (warningEl) warningEl.style.display = 'none';
    
    const btnAgregar = document.getElementById('btnAgregarConsultora');
    if (btnAgregar) {
        btnAgregar.style.display = derived.isExternal ? 'inline-block' : 'none';
    }
    
    updatePreview();
    autosaveState();
});

document.getElementById('btnAgregarConsultora')?.addEventListener('click', () => {
    Swal.fire({
        title: 'Nombre de la Consultora',
        input: 'text',
        inputPlaceholder: 'Ej: Accenture, Globant, etc.',
        showCancelButton: true,
        confirmButtonText: 'Guardar',
        cancelButtonText: 'Cancelar',
        confirmButtonColor: 'var(--primary)',
    }).then((result) => {
        if (result.isConfirmed && result.value) {
            const consultora = result.value.trim();
            let baseEmpresa = 'Externos Empresa Principal';
            const emailVal = (document.getElementById('planEmailRetira')?.value || '').toLowerCase();
            if (emailVal.includes('subsidiaria')) {
                baseEmpresa = 'Externos Subsidiaria';
            } else if (planillaSpec.empresa && planillaSpec.empresa.startsWith('Externos')) {
                baseEmpresa = planillaSpec.empresa.split(' (')[0];
            }
            
            const finalEmpresa = `${baseEmpresa} (${consultora})`;
            planillaSpec.empresa = finalEmpresa;
            const input = document.getElementById('planEmpresa');
            if (input) {
                input.value = finalEmpresa;
            }
            updatePreview();
            autosaveState();
        }
    });
});

document.getElementById('planSaludo').addEventListener('input', (e) => {
    planillaSpec.saludoOverride = e.target.value;
    updatePreview();
    autosaveState();
});

document.getElementById('btnToggleSaludoEditor').addEventListener('click', () => {
    const wrap = document.getElementById('saludoEditorWrap');
    const isVisible = wrap.style.display === 'flex' || wrap.style.display === 'block';
    
    if (isVisible) {
        wrap.style.display = 'none';
        document.getElementById('btnToggleSaludoEditor').textContent = 'Personalizar Saludo';
    } else {
        wrap.style.display = 'flex';
        document.getElementById('btnToggleSaludoEditor').textContent = 'Ocultar Editor';
        // Prefill default template if empty
        if (!planillaSpec.saludoOverride) {
            const auto = buildSaludoPlainAuto(planillaSpec);
            planillaSpec.saludoOverride = auto;
            document.getElementById('planSaludo').value = auto;
            updatePreview();
            autosaveState();
        }
    }
});

document.getElementById('btnLoadDefaultSaludo').addEventListener('click', () => {
    const auto = buildSaludoPlainAuto(planillaSpec);
    planillaSpec.saludoOverride = auto;
    document.getElementById('planSaludo').value = auto;
    updatePreview();
    autosaveState();
});

document.getElementById('btnResetSaludo').addEventListener('click', () => {
    planillaSpec.saludoOverride = '';
    document.getElementById('planSaludo').value = '';
    updatePreview();
    autosaveState();
});

document.getElementById('btnAddItem').addEventListener('click', () => {
    // Determine default type based on action rules or fallback to PC
    const action = ACTION_RULES[planillaSpec.action];
    const rule = action?.reasons[planillaSpec.reason];
    const type = rule?.validItemTypes[0] || 'PC';
    const mov = rule?.movs[0] || 'egreso';
    
    const motherTicket = (planillaSpec.ticket || '').trim();
    
    if (motherTicket) {
        Swal.fire({
            title: '¿Mismo número de ticket?',
            text: `¿Este ítem pertenece al mismo nro de ticket (${motherTicket})?`,
            icon: 'question',
            showCancelButton: true,
            showDenyButton: true,
            confirmButtonText: 'Sí',
            denyButtonText: 'No (Ingresar nuevo)',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: 'var(--primary)',
            denyButtonColor: 'var(--accent)'
        }).then((result) => {
            if (result.isConfirmed) {
                const newItem = makeEmptyItem(type, mov);
                newItem.ticket = motherTicket;
                planillaSpec.items.push(newItem);
                renderItemsList();
                updatePreview();
                autosaveState();
            } else if (result.isDenied) {
                Swal.fire({
                    title: 'Nuevo número de ticket/incidente',
                    input: 'text',
                    inputPlaceholder: 'INC00000XXXXXXXX o WO00000XXXXXXX',
                    showCancelButton: true,
                    confirmButtonText: 'Aceptar',
                    cancelButtonText: 'Cancelar',
                    confirmButtonColor: 'var(--primary)',
                    inputValidator: (value) => {
                        if (!value || !value.trim()) {
                            return 'Debés ingresar un número de ticket';
                        }
                    }
                }).then((inputResult) => {
                    if (inputResult.isConfirmed) {
                        const newItem = makeEmptyItem(type, mov);
                        newItem.ticket = inputResult.value.trim();
                        planillaSpec.items.push(newItem);
                        renderItemsList();
                        updatePreview();
                        autosaveState();
                    }
                });
            }
        });
    } else {
        Swal.fire({
            title: 'Ingresar número de ticket/incidente',
            input: 'text',
            inputPlaceholder: 'INC00000XXXXXXXX o WO00000XXXXXXX',
            showCancelButton: true,
            confirmButtonText: 'Aceptar',
            cancelButtonText: 'Cancelar (dejar vacío)',
            confirmButtonColor: 'var(--primary)',
        }).then((inputResult) => {
            if (inputResult.isDismissed && inputResult.dismiss === Swal.DismissReason.backdrop) {
                return;
            }
            const newItem = makeEmptyItem(type, mov);
            if (inputResult.isConfirmed && inputResult.value) {
                newItem.ticket = inputResult.value.trim();
            } else {
                newItem.ticket = '';
            }
            planillaSpec.items.push(newItem);
            renderItemsList();
            updatePreview();
            autosaveState();
        });
    }
});

// Clear All
document.getElementById('btnClearAll').addEventListener('click', () => {
    Swal.fire({
        title: '¿Confirmás limpiar todo?',
        text: 'Se vaciarán todos los ítems y campos del formulario.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: 'var(--primary)',
        cancelButtonColor: 'var(--text-muted)',

    }).then((result) => {
        if (result.isConfirmed) {

                reason: 'normal',

                ticket: '',
                empresa: '',
                tecnico: localStorage.getItem('tecnico_manual_pref') || '',
                personaRetira: '',
                emailRetira: '',
                saludoOverride: '',
                items: []
            };
            
            initializeFormElements();
            autosaveState();
            Swal.fire('Formulario Limpio', '', 'success');
        }
    });
});

// ============================================================
// ACTIONS & OUTLOOK EXPORTS
// ============================================================
function validateForm() {
    const errors = [];
    const isPrestamo = planillaSpec.action === 'prestamo';
    const isCorreoInterno = planillaSpec.logistics === 'correo_interno';
    
    if (!planillaSpec.ticket && !isPrestamo) {
        errors.push({ id: 'planTicket', msg: 'El número de incidente/ticket es obligatorio.' });
    }
    
    if (!planillaSpec.personaRetira && !isCorreoInterno) {
        errors.push({ id: 'planPersonaRetira', msg: 'El nombre de quien retira es obligatorio.' });
    }
    
    if (planillaSpec.items.length === 0) {
        errors.push({ id: 'itemsList', msg: 'Debes agregar al menos un ítem al movimiento.' });
    }
    
    // Clear previous errors
    document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
    document.querySelectorAll('.field-error').forEach(el => el.textContent = '');
    
    if (errors.length > 0) {
        errors.forEach(err => {
            const field = document.getElementById(err.id);
            if (field) field.classList.add('is-invalid');
            const slot = document.getElementById(`error-${err.id}`);
            if (slot) {
                slot.textContent = err.msg;
                slot.style.display = 'block';
            }
        });
        
        Swal.fire({
            title: 'Campos incompletos',
            text: 'Revisá los errores antes de exportar el template.',
            icon: 'error',
            confirmButtonColor: 'var(--primary)'
        });
        return false;
    }
    return true;
}

// Copy Subject
document.getElementById('btnCopySubject').addEventListener('click', () => {
    const subject = buildPlanillaSubject(planillaSpec);
    navigator.clipboard.writeText(subject).then(() => {
        Swal.fire({
            icon: 'success',
            title: 'Asunto Copiado',
            text: subject,
            timer: 1500,
            showConfirmButton: false
        });
    });
});


// Send via Outlook desktop app protocol
document.getElementById('btnSendOutlook').addEventListener('click', () => {
    if (!validateForm()) return;
    
    const to = "rerodriguez@texpert.com.ar";
    const ccList = "tecnologiausuariosdt@texpert.com.ar";
    const subject = buildPlanillaSubject(planillaSpec);
    
    const bodyHtml = buildPlanillaHtmlBody(planillaSpec);
    const fullHtml = `<html><body style="font-family: Arial, sans-serif;">${bodyHtml}</body></html>`;
    
    const payload = { To: to, Cc: ccList, Subject: subject, Body: fullHtml };
    const base64Str = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
    
    const frame = document.createElement('iframe');
    frame.style.display = 'none';
    frame.src = `templategen://${base64Str}`;
    document.body.appendChild(frame);
    setTimeout(() => {
        frame.remove();
        Swal.fire({
            icon: 'success',
            title: 'Enviado a Outlook',
            text: 'Se abrió la aplicación Outlook en tu escritorio.',
            timer: 2000,
            showConfirmButton: false
        });
    }, 1500);
});

document.addEventListener('DOMContentLoaded', () => {
    loadState();
    
    // Ensure default items if none loaded
    if (planillaSpec.items.length === 0) {
        planillaSpec.items.push(makeEmptyItem('PC', 'egreso'));
    }
    
    initializeFormElements();
});
